ci:
  - changed-files:
      - any-glob-to-any-file: [.github/**, justfile, renovate.json]
docs:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
validation:
  - changed-files:
      - any-glob-to-any-file: ["src/Rules/**", "tests/Rules/**", "lang/**"]
casts:
  - changed-files:
      - any-glob-to-any-file: ["src/Casts/**", "tests/Casts/**"]
blade:
  - changed-files:
      - any-glob-to-any-file: ["src/Formatter.php", "tests/BladeTest.php"]
config:
  - changed-files:
      - any-glob-to-any-file: ["config/**", "src/AriaryOptions.php"]
