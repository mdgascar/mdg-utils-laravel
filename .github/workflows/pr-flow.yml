name: PR flow

# Branch model: topic branches (feat/…, fix/…) → dev → main.
# main only receives merges from dev; nothing is committed to main or dev directly.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          topic='^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)/[a-z0-9._-]+$'
          bots='^(changeset-release|renovate|dependabot)/'
          case "$BASE" in
            main)
              [ "$HEAD" = dev ] && exit 0
              echo "::error::main only accepts merges from dev (this PR is from '$HEAD'). Target dev instead."
              exit 1 ;;
            dev)
              if [[ "$HEAD" =~ $topic || "$HEAD" =~ $bots ]]; then exit 0; fi
              echo "::error::Branch '$HEAD' must be named <type>/<short-name>, e.g. feat/ariary-format or fix/phone-dots."
              exit 1 ;;
            *)
              exit 0 ;;
          esac
