name: Triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Thanks for opening your first issue in mdg-utils-laravel! A maintainer will reply within 72 hours.
            If it is about data, please include a link to an official source.
          pr_message: |
            Thanks for your first pull request to mdg-utils-laravel! 🎉
            CI checks run first; once they are green, the right reviewer is requested automatically.
            The steps are in [CONTRIBUTING.md](https://github.com/mdgascar/mdg-utils-laravel/blob/dev/CONTRIBUTING.md).
